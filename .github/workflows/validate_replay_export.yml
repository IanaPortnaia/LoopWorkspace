name: Validate Replay Export

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Replay overlay guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Test the fail-closed build guard
        run: python3 -m unittest discover -s Scripts/tests -v
      - name: Validate and apply the current overlay
        run: python3 Scripts/replay_export.py apply
      - name: Verify applied changes
        run: python3 Scripts/replay_export.py verify-applied

  validate:
    name: Compile and test without distribution signing
    needs: static
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Select the same Xcode as both upstream build workflows
        run: sudo xcode-select --switch "$(python3 Scripts/replay_export.py xcode-path)"
      - name: Apply and validate Schema 7
        run: python3 Scripts/replay_export.py validate
      - name: Upload validation summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: replay-validation
          if-no-files-found: warn
          path: |
            artifacts/replay-validation-*/*.xcresult
            artifacts/replay-validation-*/validation.json
